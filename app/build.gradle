plugins {
    id 'com.android.application'
}

android {
    namespace 'com.imdjay.smoothnotificationfixer'
    compileSdk 35

    defaultConfig {
        applicationId "com.imdjay.smoothnotificationfixer"
        minSdk 24
        targetSdk 35
        versionCode 101
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
